<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Guides</title>
<meta name="description" content="Study guides for history (the Age of Exploration) and biology (the human digestive system).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='11' height='20' rx='2' fill='%231c4e7b'/%3E%3Crect x='17' y='6' width='11' height='20' rx='2' fill='%238a2337'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=Young+Serif&display=swap">
<style>
/* Two buttons centered on the page, each in its guide's own color and typeface. */
:root{
  color-scheme:light;
  --paper:#f3f3f1; --hist:#1c4e7b; --bio:#8a2337; --on:#fff;
  --f-hist:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-bio:"Young Serif", "Iowan Old Style", Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#121417; --hist:#2b6596; --bio:#a3324c; color-scheme:dark; }
}
:root[data-theme="dark"]{ --paper:#121417; --hist:#2b6596; --bio:#a3324c; color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:var(--paper);
  padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
a{display:grid;place-items:center;width:280px;height:104px;border-radius:14px;background:var(--c);color:var(--on);
  text-decoration:none;font-size:2.25rem;line-height:1;letter-spacing:.01em;
  transition:transform .15s ease, background-color .15s ease}
a.hist{--c:var(--hist);font-family:var(--f-hist)}
a.bio{--c:var(--bio);font-family:var(--f-bio);font-size:2rem}
a:hover{transform:translateY(-2px);background:color-mix(in srgb, var(--c) 88%, #fff)}
a:active{transform:translateY(0)}
a:focus-visible{outline:3px solid var(--c);outline-offset:4px}
@media (max-width: 620px){
  nav{flex-direction:column;width:100%;max-width:340px}
  a{width:100%}
}
@media (prefers-reduced-motion: reduce){ a{transition:none} a:hover{transform:none} }
</style>
</head>
<body>
<h1 class="sr">Study guides</h1>
<nav aria-label="Study guides">
  <a class="hist" href="history/">History</a>
  <a class="bio" href="biology/">Biology</a>
</nav>
</body>
</html>
